# Merge into the dedicated workflow compose project; no public ports or shared website changes.
services:
  student-preview:
    image: gotenberg/gotenberg@sha256:4c0eb92ef22e5d5fb0a49eac924b63d85d0b0334ea3365a1f5ca428f367b3054
    restart: unless-stopped
    networks: [student_preview]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    environment:
      API_BODY_LIMIT: 32MB
      API_TIMEOUT: 60s
      API_DOWNLOAD_FROM_DENY_LIST: ".*"
      WEBHOOK_DENY_LIST: ".*"
      LIBREOFFICE_DENY_LIST: ".*"
      LIBREOFFICE_MAX_QUEUE_SIZE: 1
      PDFENGINES_DISABLE_ROUTES: "true"
networks:
  student_preview:
    internal: true
