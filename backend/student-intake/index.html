<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生创意申请 · 帧智汇</title><style>body{margin:0;background:#f4f6f8;color:#1e293b;font:16px/1.6 system-ui}main{max-width:640px;margin:40px auto;padding:28px;background:white;border:1px solid #e2e8f0;border-radius:8px}header{border-bottom:1px solid #e2e8f0;margin-bottom:24px}small{color:#64748b}h1{font-size:26px;margin:12px 0}label{display:block;margin:18px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #94a3b8;border-radius:6px;font:inherit}button{margin-top:24px;padding:12px 24px;background:#176b56;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap} @media(max-width:680px){main{margin:12px;padding:20px}}</style><main><header><small>帧智汇 · 校园创意征集</small><h1>让你的创意走向作品</h1><p>填写个人信息与创意，提交后将由编剧团队审核。</p></header><p id="status" role="status">正在验证身份…</p><form id="form" hidden><label for="name">姓名 *</label><input id="name" required maxlength="80" autocomplete="name"><label for="phone">电话 *</label><input id="phone" type="tel" required minlength="7" maxlength="25" autocomplete="tel"><label for="school">学校 *</label><input id="school" required maxlength="200" autocomplete="organization"><label for="creative">提交创意 *</label><textarea id="creative" rows="9" required maxlength="12000" placeholder="介绍你的故事、人物和最想表达的想法"></textarea><small>请勿填写与申请无关的敏感信息。资料用于创意审核与联系。</small><br><button id="submit">提交创意申请</button></form></main><script>
let session=sessionStorage.getItem('intakeSession');const status=document.querySelector('#status'),form=document.querySelector('#form');async function req(path,data,token){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||'提交失败');return x}async function init(){try{const code=new URLSearchParams(location.hash.slice(1)).get('code');if(code){const x=await req('/api/session',{code});session=x.session;sessionStorage.setItem('intakeSession',session);document.querySelector('#name').value=x.name;history.replaceState(null,'',location.pathname)}if(!session)throw Error('请从学校或合作系统的申请入口进入，此页面需要验证身份。');status.textContent='身份已验证，请填写申请。';form.hidden=false}catch(e){status.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#submit');btn.disabled=true;try{const data=Object.fromEntries(['name','phone','school','creative'].map(k=>[k,document.getElementById(k).value]));const x=await req('/api/apply',data,session);form.hidden=true;status.textContent=(x.state==='submitted'?'申请提交成功，已进入审核流程。':'申请已保存，流程启动待确认，请勿重复提交。')+'\n申请编号：'+x.id}catch(e){status.textContent=e.message;btn.disabled=false}};init();</script></html>
