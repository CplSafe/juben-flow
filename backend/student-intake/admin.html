<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生创意申请记录</title><style>body{font:15px/1.6 system-ui;padding:24px;color:#1e293b}input,button{padding:10px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border-bottom:1px solid #ddd;text-align:left;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6f7;padding:20px}button{cursor:pointer}</style><h1>学生创意申请记录</h1><p>使用帧智汇管理员账号登录，查看申请人、原系统身份、表单和审批记录。</p><form id="login"><input id="username" placeholder="管理员账号" required><input id="password" type="password" placeholder="密码" required><button>登录查询</button></form><p id="msg" role="status"></p><table><thead><tr><th>申请人</th><th>学校</th><th>来源系统</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><pre id="detail" hidden></pre><script>let token;const msg=document.querySelector('#msg');async function get(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+token}});const x=await r.json();if(!r.ok)throw Error(x.error);return x}document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/admin-api/system/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const x=await r.json();if(x.code!==0)throw Error(x.msg);token=x.data.accessToken;document.querySelector('#password').value='';const rows=await get('/api/applications');document.querySelector('#rows').replaceChildren();for(const item of rows){const tr=document.createElement('tr');for(const k of ['name','school','source','state']){const td=document.createElement('td');td.textContent=item[k];tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看表单与审批';b.onclick=async()=>{try{const d=await get('/api/application/'+item.id),el=document.querySelector('#detail');el.hidden=false;el.textContent=JSON.stringify(d,null,2)}catch(e){msg.textContent=e.message}};td.append(b);tr.append(td);document.querySelector('#rows').append(tr)}msg.textContent=rows.length?'已加载申请记录':'暂无申请记录'}catch(e){msg.textContent=e.message}};</script></html>
